<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Embossed Text with a 3D letterpress effect"
  >
  <title>CSS Embossed Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="emboss-showcase" aria-labelledby="emboss-title">
      <span class="eyebrow">PURE CSS EFFECT</span>

      <h1 id="emboss-title" class="embossed-text">
        EMBOSSED
      </h1>

      <p>
        A subtle CSS letterpress effect created using layered text shadows.
      </p>

      <span class="subtle-text">DEPRESSED • RAISED • REFINED</span>
    </section>
  </main>

</body>
</html>
